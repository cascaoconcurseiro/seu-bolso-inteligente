<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <style>
    .stroke { stroke: url(#grad); stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .fill { fill: url(#grad); }
    .bg { fill: #ffffff; }
  </style>

  <!-- Top Coin -->
  <circle cx="260" cy="120" r="50" class="stroke bg" />
  <path d="M 235 95 Q 260 85 285 105" class="stroke" stroke-width="16" />

  <!-- Pig Ear -->
  <path d="M 180 180 L 190 140 L 220 170" class="stroke bg" />

  <!-- Piggy Bank Body -->
  <path d="
    M 210 165 
    C 300 155 380 180 410 260
    M 175 180 
    C 130 200 110 250 110 290
    L 80 290
    C 60 290 60 330 80 330
    L 115 330
    C 120 360 130 380 130 380
    L 130 420 L 170 420 L 170 395
    C 200 410 230 415 250 410
  " class="stroke" />
  
  <!-- Pig Eye -->
  <circle cx="165" cy="250" r="16" class="fill" />
  
  <!-- Coin Slot -->
  <path d="M 230 210 L 280 210" class="stroke" stroke-width="24" />

  <!-- Bottom Right Coin -->
  <circle cx="340" cy="340" r="95" class="stroke bg" />
  <path d="M 340 270 L 340 410" class="stroke" stroke-width="20" />
  <path d="M 365 305 C 345 285 315 285 315 315 C 315 340 365 340 365 370 C 365 400 335 400 315 385" class="stroke" stroke-width="24" />
</svg>
