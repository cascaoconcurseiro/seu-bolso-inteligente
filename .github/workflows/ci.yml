name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tsc na raiz é no-op (files: [] + references); o projeto real é tsconfig.app.json.
      # Não-bloqueante até zerar o backlog de erros pré-existentes (~560, maioria TS6133).
      - run: npx tsc --noEmit -p tsconfig.app.json
        continue-on-error: true
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check bundle size
        run: |
          du -sh dist/
          echo "Total files: $(find dist -type f | wc -l)"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:secrets
      # Bloqueante: vulnerabilidades high/critical em deps de produção impedem o merge.
      # (--omit=dev: a cadeia vite/esbuild só afeta o dev server e exige major bump)
      - run: npm audit --audit-level=high --omit=dev

  database-security:
    name: Database Security Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify live RPC grants and tenant isolation
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: npm run test:db-security
      - name: Require database connection secret
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: |
          echo "SUPABASE_DB_URL secret is required for database security checks"
          exit 1

  e2e:
    name: E2E (Playwright chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
