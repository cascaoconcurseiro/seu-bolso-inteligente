<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pé de Meia — Controle Financeiro</title>
    <meta name="description" content="Controle financeiro para famílias. Simples, limpo e direto ao ponto." />
    <meta name="author" content="Pé de Meia" />
    <meta name="theme-color" content="#10b981" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pé de Meia" />

    <meta property="og:title" content="Pé de Meia — Controle Financeiro" />
    <meta property="og:description" content="Controle financeiro para famílias. Simples, limpo e direto ao ponto." />
    <meta property="og:type" content="website" />

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      #native-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      html.dark #native-splash {
        background-color: #09090b;
      }
      #native-splash .logo {
        width: 72px;
        height: 72px;
        background-color: #10b981;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse-splash 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
      }
      #native-splash .logo svg {
        width: 36px;
        height: 36px;
        color: white;
      }
      #native-splash .text {
        margin-top: 20px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 26px;
        color: #09090b;
        letter-spacing: -0.05em;
      }
      html.dark #native-splash .text {
        color: #fafafa;
      }
      @keyframes pulse-splash {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(0.95); }
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}

        // Listener global para capturar erros de carregamento de chunk (comum pós-update de PWA)
        window.addEventListener('error', function(e) {
          var isChunkError = e.message && (
            e.message.includes('dynamically imported module') || 
            e.message.includes('Failed to fetch') ||
            e.message.includes('Importing a module script failed') ||
            e.message.includes('resolving a module specifier')
          );
          
          if (isChunkError || e.name === 'ChunkLoadError') {
            console.warn('[PWA] Erro de carregamento de módulo detectado. Forçando limpeza de cache e recarregamento...');
            
            // Tenta limpar os caches do navegador para remover index.html preso
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) {
                  caches.delete(names[i]);
                }
              });
            }
            
            // Previne loop infinito: só recarrega se não tentou recentemente
            if (!sessionStorage.getItem('chunk_retried')) {
              sessionStorage.setItem('chunk_retried', 'true');
              window.location.reload();
            }
          }
        }, true); // true para capturar na fase de captura (antes que pare a execução)
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="native-splash">
        <div class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></svg>
        </div>
        <div class="text">pé de meia</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
