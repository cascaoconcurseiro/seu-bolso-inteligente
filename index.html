    <!-- Tipografia nativa: evita rede bloqueante e combina com iOS/Android. -->
    <style>
      #native-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.25s ease-out;
      }
      #native-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      html.dark #native-splash {
        background-color: #09090b;
      }
      #native-splash .logo {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse-splash 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #native-splash .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #native-splash .text {
        margin-top: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 26px;
        color: #09090b;
        letter-spacing: -0.05em;
      }
      html.dark #native-splash .text {
        color: #fafafa;
      }
      @keyframes pulse-splash {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.9;
          transform: scale(0.95);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (
            theme === "dark" ||
            (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}

        // ─── PWA CHUNK ERROR RECOVERY ───────────────────────────────────────────
        // Quando o Service Worker serve um JS com hash antigo e o servidor retorna
        // index.html (404→HTML), o browser lança "Failed to load module script".
        // Esta lógica limpa TODOS os caches e desregistra o SW de forma bloqueante
        // antes de recarregar, garantindo que o reload pegue os assets novos.
        // ────────────────────────────────────────────────────────────────────────
        var RECOVERY_KEY = "pwa_chunk_recovery_ts";
        var RECOVERY_LIMIT_MS = 30000; // 30s entre tentativas automáticas

        var lastErrorMessage = "";

        function showManualButton() {
          var splash = document.getElementById("native-splash");
          if (splash && !document.getElementById("force-reload-btn")) {
            // Mensagem explicativa
            var msg = document.createElement("p");
            msg.style.cssText =
              "margin-top:16px;font-family:Inter,sans-serif;font-size:13px;color:#71717a;text-align:center;max-width:260px;line-height:1.5;";
            msg.innerHTML = "Nova versão disponível.<br>Toque para atualizar.";
            splash.appendChild(msg);

            // Botão atualizar
            var btn = document.createElement("button");
            btn.id = "force-reload-btn";
            btn.innerHTML = "Atualizar App";
            btn.style.cssText =
              "margin-top:20px;padding:14px 32px;background:#10b981;color:#fff;border:none;border-radius:12px;cursor:pointer;font-family:Inter,sans-serif;font-size:16px;font-weight:700;box-shadow:0 4px 20px rgba(16,185,129,0.4);transition:opacity 0.2s;";
            btn.onclick = function () {
              btn.innerHTML = "⏳ Limpando cache...";
              btn.style.opacity = "0.7";
              btn.disabled = true;
              localStorage.removeItem(RECOVERY_KEY);
              hardClearAndReload();
            };
            splash.appendChild(btn);

            // Caixa de log de erro copiável
            if (lastErrorMessage) {
              var logWrap = document.createElement("div");
              logWrap.style.cssText = "margin-top:28px;width:88vw;max-width:340px;";

              var logLabel = document.createElement("p");
              logLabel.style.cssText =
                "font-family:Inter,sans-serif;font-size:11px;color:#52525b;margin-bottom:6px;text-align:left;";
              logLabel.innerHTML = "Código do erro (toque para copiar):";
              logWrap.appendChild(logLabel);

              var logBox = document.createElement("pre");
              logBox.id = "error-log-box";
              logBox.style.cssText =
                "background:#18181b;color:#a1a1aa;font-family:monospace;font-size:10px;padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;text-align:left;border:1px solid #27272a;cursor:pointer;max-height:120px;overflow-y:auto;";
              logBox.textContent = lastErrorMessage;
              logBox.title = "Toque para copiar";
              logBox.onclick = function () {
                if (navigator.clipboard) {
                  navigator.clipboard.writeText(lastErrorMessage).then(function () {
                    logLabel.innerHTML = "✅ Copiado!";
                    setTimeout(function () {
                      logLabel.innerHTML = "Código do erro (toque para copiar):";
                    }, 2000);
                  });
                } else {
                  var sel = window.getSelection();
                  var range = document.createRange();
                  range.selectNodeContents(logBox);
                  sel.removeAllRanges();
                  sel.addRange(range);
                }
              };
              logWrap.appendChild(logBox);
              splash.appendChild(logWrap);
            }
          }
        }

        function hardClearAndReload() {
          var swDone =
            "serviceWorker" in navigator
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(
                    regs.map(function (r) {
                      return r.unregister();
                    })
                  );
                })
              : Promise.resolve();

          var cacheDone =
            "caches" in window
              ? caches.keys().then(function (names) {
                  return Promise.all(
                    names.map(function (n) {
                      return caches.delete(n);
                    })
                  );
                })
              : Promise.resolve();

          Promise.all([swDone, cacheDone])
            .then(function () {
              // Usa replace() sem query string: evita que o SW (já desregistrado)
              // responda ao request. O history.pushState não ajuda aqui.
              window.location.replace(window.location.pathname);
            })
            .catch(function () {
              window.location.replace(window.location.pathname);
            });
        }

        window.addEventListener(
          "error",
          function (e) {
            var isChunkError =
              (e.message &&
                (e.message.includes("dynamically imported module") ||
                  e.message.includes("Failed to fetch") ||
                  e.message.includes("Importing a module script failed") ||
                  e.message.includes("resolving a module specifier") ||
                  e.message.includes("Failed to load module script") ||
                  e.message.includes("text/html"))) ||
              (e.target && e.target.nodeName === "SCRIPT" && e.type === "error");

            if (!isChunkError && e.name !== "ChunkLoadError") return;

            // Captura o erro para exibir na tela de recuperação e persistir no localStorage
            lastErrorMessage = [
              "Erro: " + (e.message || "ChunkLoadError"),
              "Arquivo: " + (e.filename || (e.target && e.target.src) || "desconhecido"),
              "Linha: " + (e.lineno || "-"),
              "Data: " + new Date().toISOString(),
              "UA: " + navigator.userAgent.slice(0, 120),
            ].join("\n");

            // Persiste para o errorLogger do React enviar ao Supabase após reload
            try {
              var pending = JSON.parse(localStorage.getItem("pending_error_log") || "[]");
              pending.push({
                error_type: "ChunkLoadError",
                message: e.message || "Failed to load module script",
                file: e.filename || (e.target && e.target.src) || "",
                line: e.lineno || null,
                extra: { type: "chunk_error", ua: navigator.userAgent.slice(0, 300) },
              });
              localStorage.setItem("pending_error_log", JSON.stringify(pending.slice(-5)));
            } catch (_) {}

            console.warn(
              "[PWA] Erro de carregamento de módulo detectado. Iniciando recuperação..."
            );

            var now = Date.now();
            var lastRetry = parseInt(localStorage.getItem(RECOVERY_KEY) || "0");

            if (!lastRetry || now - lastRetry > RECOVERY_LIMIT_MS) {
              localStorage.setItem(RECOVERY_KEY, now.toString());
              hardClearAndReload();
            } else {
              showManualButton();
            }
          },
          true
        );

        // Limpa o flag de recovery se a página carregou com sucesso após N segundos
        // (significa que o reload funcionou e não estamos em loop)
        setTimeout(function () {
          localStorage.removeItem(RECOVERY_KEY);
        }, 12000);
      })();
    </script>
