<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pé de Meia — Controle Financeiro</title>
    <meta name="description" content="Controle financeiro para famílias. Simples, limpo e direto ao ponto." />
    <meta name="author" content="Pé de Meia" />
    <meta name="theme-color" content="#10b981" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pé de Meia" />

    <meta property="og:title" content="Pé de Meia — Controle Financeiro" />
    <meta property="og:description" content="Controle financeiro para famílias. Simples, limpo e direto ao ponto." />
    <meta property="og:type" content="website" />

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      #native-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      html.dark #native-splash {
        background-color: #09090b;
      }
      #native-splash .logo {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse-splash 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #native-splash .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #native-splash .text {
        margin-top: 20px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 26px;
        color: #09090b;
        letter-spacing: -0.05em;
      }
      html.dark #native-splash .text {
        color: #fafafa;
      }
      @keyframes pulse-splash {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(0.95); }
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}

        // Listener global para capturar erros de carregamento de chunk (comum pós-update de PWA)
        window.addEventListener('error', function(e) {
          var isChunkError = (e.message && (
            e.message.includes('dynamically imported module') || 
            e.message.includes('Failed to fetch') ||
            e.message.includes('Importing a module script failed') ||
            e.message.includes('resolving a module specifier') ||
            e.message.includes('Failed to load module script') ||
            e.message.includes('text/html')
          )) || (e.target && e.target.nodeName === 'SCRIPT');
          
          if (isChunkError || e.name === 'ChunkLoadError') {
            console.warn('[PWA] Erro de carregamento de módulo detectado. Forçando limpeza de cache, SW e recarregamento...');
            
            // Tenta limpar os caches do navegador para remover assets presos
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) {
                  caches.delete(names[i]);
                }
              });
            }

            // Desregistra o Service Worker que pode estar servindo arquivos velhos
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
              });
            }
            
            // Previne loop infinito: só recarrega se não tentou recentemente (a cada 3 segundos)
            var lastRetry = sessionStorage.getItem('chunk_retry_timestamp');
            var now = Date.now();
            if (!lastRetry || (now - parseInt(lastRetry)) > 3000) {
              sessionStorage.setItem('chunk_retry_timestamp', now.toString());
              
              // Pequeno delay para garantir que o SW foi desregistrado e o cache limpo
              setTimeout(function() {
                var currentUrl = window.location.href.split('#')[0];
                var separator = currentUrl.indexOf('?') !== -1 ? '&' : '?';
                window.location.href = currentUrl + separator + 't=' + Date.now();
              }, 500);
            } else {
              console.error('[PWA] Fallback de recuperação falhou repetidamente. Atualize a página manualmente.');
              // Mostrar botão de recarregar manual na tela
              var splash = document.getElementById('native-splash');
              if (splash) {
                var btn = document.createElement('button');
                btn.innerHTML = 'Forçar Atualização';
                btn.style.marginTop = '20px';
                btn.style.padding = '10px 20px';
                btn.style.backgroundColor = '#10b981';
                btn.style.color = 'white';
                btn.style.border = 'none';
                btn.style.borderRadius = '8px';
                btn.style.cursor = 'pointer';
                btn.style.fontFamily = 'Inter, sans-serif';
                btn.onclick = function() { window.location.href = window.location.href.split('#')[0] + '?t=' + Date.now(); };
                splash.appendChild(btn);
              }
            }
          }
        }, true); // true para capturar na fase de captura (antes que pare a execução)
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="native-splash">
        <div class="logo">
          <img src="/icon-512.png" alt="Logo Pé de Meia" />
        </div>
        <div class="text">pé de meia</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
